<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Simple Gantt</title>
	<style>
		body {
			font-family: Arial, Helvetica, sans-serif;
			background: #FFFFFF;
		}
		.divisor {
			margin: 0 15px;
		}
		.gantt-target {
			height: calc(100vh - 150px);
		}
	</style>
	<link rel="stylesheet" href="https://maxcdn.icons8.com/fonts/line-awesome/1.1/css/line-awesome-font-awesome.min.css">
	<link rel="stylesheet" href="../dist/frappe-gantt.css" />
	<script src="../dist/frappe-gantt.js"></script>
</head>
<body>
	<h3>Interactive Gantt Chart entirely made in SVG!</h3>
	<div id="gantt-target" class="gantt-target">
		<button onclick="gantt.change_view_mode('Hour')">Hour</button>
		<button onclick="gantt.change_view_mode('Quarter Day')">Quarter Day</button>
		<button onclick="gantt.change_view_mode('Half Day')">Half Day</button>
		<button onclick="gantt.change_view_mode('Day')">Day</button>
		<button onclick="gantt.change_view_mode('Week')">Week</button>
		<button onclick="gantt.change_view_mode('Month')">Month</button>
		<button onclick="gantt.change_view_mode('Year')">Year</button>
		<span class="divisor"> | </span>
		<button onclick="gantt.scrolling_today()">Today</button>
		<span class="divisor"> | </span>
		<button onclick="reload()">Reload</button>
		<span class="divisor"> | </span>
		<button onclick="gantt.zoom_reset()">Zoom Reset</button>
		<button onclick="gantt.zoom_out()">Zoom Out</button>
		<button onclick="gantt.zoom_in()">Zoom In</button>
		<select onchange="gantt.zoom_percent(this.value)">
			<option onchange="gantt.zoom_percent(100)" value="100" selected>100%</option>
			<option onchange="gantt.zoom_percent(125)" value="125">125%</option>
			<option onchange="gantt.zoom_percent(150)" value="150">150%</option>
			<option onchange="gantt.zoom_percent(175)" value="175">175%</option>
			<option onchange="gantt.zoom_percent(200)" value="200">200%</option>
		</select>
		<span class="divisor"> | </span>
		<button onclick="gantt.fullscreen(true)">Fullscreen - On</button>
		<button onclick="gantt.fullscreen(false)">Fullscreen - Off</button>
		<span class="divisor"> | </span>
		<button onclick="gantt.resource_expand_all()">Expandir todos</button>
		<button onclick="gantt.resource_collapse_all()">Fechar todos</button>
		<br><br>
	</div>
	<script defer src="./example-3.js"></script>
</body>
</html>
